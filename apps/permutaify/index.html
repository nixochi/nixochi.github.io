opzone" class="dropzone" data-astro-cid-wkl3iqvs>or drag & drop .OBJ here</div> </div> <div class="control-group" data-astro-cid-wkl3iqvs> <label class="control-label" data-astro-cid-wkl3iqvs>Scale</label> <div class="input-row" data-astro-cid-wkl3iqvs> <input type="number" id="scaleInput" min="0.1" max="100" step="0.1" value="1" data-astro-cid-wkl3iqvs> <button class="action-btn compute-btn" id="computeBtn" data-astro-cid-wkl3iqvs>Compute</button> </div> </div> <div class="control-group" data-astro-cid-wkl3iqvs> <label class="control-label" style="display: flex; align-items: center; cursor: pointer;" data-astro-cid-wkl3iqvs> <input type="checkbox" id="multiRayToggle" style="margin-right: 8px;" data-astro-cid-wkl3iqvs> <span data-astro-cid-wkl3iqvs>3-ray voting (more robust, 3x slower)</span> </label> </div> <div class="control-group" data-astro-cid-wkl3iqvs> <label class="control-label" data-astro-cid-wkl3iqvs>Statistics</label> <div class="stats" data-astro-cid-wkl3iqvs> <div data-astro-cid-wkl3iqvs>Total Voxels: <span id="totalCubes" data-astro-cid-wkl3iqvs>0</span></div> <div data-astro-cid-wkl3iqvs>Memory: <span id="memoryUsage" data-astro-cid-wkl3iqvs>--</span></div> <div data-astro-cid-wkl3iqvs>Voxelization: <span id="voxelTime" data-astro-cid-wkl3iqvs>--</span></div> </div> </div> </div> <div class="debug-container" data-astro-cid-wkl3iqvs> <div class="debug-header" data-astro-cid-wkl3iqvs> <button class="copy-log-btn" id="copyLogBtn" data-astro-cid-wkl3iqvs>Copy Log</button> </div> <div id="debugConsole" data-astro-cid-wkl3iqvs></div> </div> <script type="module">
    import { loadOBJFile, loadOBJFromURL } from './loader.js';
    import { Renderer } from './renderer.js';
    import { voxelizeModel, centerModel, applyScale, cleanupVoxelizer } from './voxelizer.js';

    // --- On-screen debug console ---
    (function(){
      const box = document.getElementById('debugConsole');
      const add = (msg, cls = 'log') => {
        const e = document.createElement('div');
        e.innerHTML = `<b class="${cls}">[${cls.toUpperCase()}]</b> ${msg}`;
        box.appendChild(e);
        box.scrollTop = box.scrollHeight;
      };
      const wrap = (fn, cls) => function(...a) {
        add(a.map(x => typeof x === 'object' ? JSON.stringify(x) : x).join(' '), cls);
        fn.apply(console, a);
      };
      console.log = wrap(console.log, 'log');
      console.warn = wrap(console.warn, 'warn');
      console.error = wrap(console.error, 'error');
      window.addEventListener('error', e => add(e.message, 'error'));
      window.addEventListener('unhandledrejection', e => add('Promise: ' + e.reason, 'error'));
    })();

    // === Copy log button ===
    const copyLogBtn = document.getElementById('copyLogBtn');
    copyLogBtn.addEventListener('click', async () => {
      const debugConsole = document.getElementById('debugConsole');
      const logText = debugConsole.innerText;

      try {
        await navigator.clipboard.writeText(logText);
        copyLogBtn.textContent = 'Copied!';
        copyLogBtn.classList.add('copied');

        setTimeout(() => {
          copyLogBtn.textContent = 'Copy Log';
          copyLogBtn.classList.remove('copied');
        }, 2000);
      } catch (err) {
        console.error('Failed to copy log:', err);
        copyLogBtn.textContent = 'Failed';
        setTimeout(() => {
          copyLogBtn.textContent = 'Copy Log';
        }, 2000);
      }
    });

    // === Initialize renderer ===
    const canvas = document.getElementById('canvas');
    let renderer;

    try {
      renderer = new Renderer(canvas);
      console.log('Renderer initialized - using single shared WebGL2 context');
    } catch (error) {
      console.error('Failed to initialize renderer:', error);
      alert(`Failed to initialize renderer: ${error.message}`);
      throw error;
    }

    // === Cleanup on page unload ===
    window.addEventListener('beforeunload', () => {
      console.log('Page unloading, cleaning up...');
      cleanupVoxelizer();
      if (renderer && renderer.dispose) {
        renderer.dispose();
      }
    });

    // === Model management ===
    let currentModel = null;
    let modelScale = 1.0;

    function processModel() {
      if (!currentModel) return;

      try {
        const centered = centerModel(currentModel);
        const scaled = applyScale(centered, modelScale);
        console.log("Calling voxelizeModel with shared context...");

        // Get multi-ray setting from checkbox
        const useMultiRay = document.getElementById('multiRayToggle')?.checked || false;

        // Pass the renderer's GL context and useMultiRay parameter to voxelizer
        const result = voxelizeModel(scaled, renderer.gl, useMultiRay);

        console.log("voxelizeModel completed");

        // Log voxel coordinate ranges for debugging
        const voxels = result.voxels;
        if (voxels.length > 0) {
          let minX = Infinity, maxX = -Infinity;
          let minY = Infinity, maxY = -Infinity;
          let minZ = Infinity, maxZ = -Infinity;

          for (let i = 0; i < voxels.length; i += 3) {
            minX = Math.min(minX, voxels[i]);
            maxX = Math.max(maxX, voxels[i]);
            minY = Math.min(minY, voxels[i + 1]);
            maxY = Math.max(maxY, voxels[i + 1]);
            minZ = Math.min(minZ, voxels[i + 2]);
            maxZ = Math.max(maxZ, voxels[i + 2]);
          }

          console.log(`Voxel bounds: X[${minX}, ${maxX}] Y[${minY}, ${maxY}] Z[${minZ}, ${maxZ}]`);
          console.log(`Voxel size: ${maxX - minX} x ${maxY - minY} x ${maxZ - minZ}`);
        }

        const stats = renderer.updateInstances(result.voxels);

        // Restart animation when new model is loaded
        renderer.restartAnimation();
        console.log("Animation restarted");

        // Update UI
        document.getElementById('totalCubes').textContent = stats.count;
        document.getElementById('memoryUsage').textContent = `${stats.totalKB} KB`;
        document.getElementById('voxelTime').textContent = `${result.time} ms`;
      } catch (error) {
        console.error('Error in processModel:', error);
        console.error('Error message:', error.message);
        console.error('Error stack:', error.stack);
        throw error;
      }
    }

    // === File upload ===
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const drop = document.getElementById('dropzone');
    const scaleInput = document.getElementById('scaleInput');
    const computeBtn = document.getElementById('computeBtn');

    uploadBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      if (e.target.files[0]) {
        try {
          currentModel = await loadOBJFile(e.target.files[0]);
          processModel();
        } catch (error) {
          console.error('Failed to load OBJ file:', error);
        }
      }
    });

    drop.addEventListener('dragover', (e) => {
      e.preventDefault();
      drop.classList.add('dragover');
    });

    drop.addEventListener('dragleave', () => {
      drop.classList.remove('dragover');
    });

    drop.addEventListener('drop', async (e) => {
      e.preventDefault();
      drop.classList.remove('dragover');
      if (e.dataTransfer.files[0]) {
        try {
          currentModel = await loadOBJFile(e.dataTransfer.files[0]);
          processModel();
        } catch (error) {
          console.error('Failed to load OBJ file:', error);
        }
      }
    });

    function applyScaleChange() {
      const val = parseFloat(scaleInput.value);
      if (val > 0) {
        modelScale = val;
        processModel();
      }
    }

    computeBtn.addEventListener('click', applyScaleChange);

    scaleInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        applyScaleChange();
      }
    });

    // === Options panel toggle ===
    const optionsBtn = document.getElementById('optionsBtn');
    const controlsPanel = document.getElementById('controlsPanel');
    let panelVisible = false;

    optionsBtn.addEventListener('click', () => {
      panelVisible = !panelVisible;
      if (panelVisible) {
        controlsPanel.classList.add('expanded');
        optionsBtn.textContent = 'Close';
      } else {
        controlsPanel.classList.remove('expanded');
        optionsBtn.textContent = 'Options';
      }
    });

    // === Restart animation ===
    document.getElementById('restart').onclick = () => renderer.restartAnimation();

    // === Load default model on startup ===
    console.log("Loading default permutahedron model...");
    loadOBJFromURL('./examples/permutahedron.obj')
      .then(model => {
        currentModel = model;
        console.log("Model loaded, starting voxelization with shared context...");
        processModel();
        console.log("Default model loaded. Ready for OBJ upload.");
      })
      .catch(error => {
        console.error('Failed to load default model:', error);
        console.error('Error message:', error.message);
        console.error('Error stack:', error.stack);
      });
