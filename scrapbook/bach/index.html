<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Permutahedron</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #1a1a1a;
            touch-action: none;
            font-family: system-ui;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
        }

        canvas:active {
            cursor: grabbing;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        .controls select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 6px 10px;
            font-size: 13px;
            font-family: system-ui;
            border-radius: 4px;
            cursor: pointer;
            height: 29px;
        }

        .controls select:hover {
            background: #444;
        }

        .controls select:focus {
            outline: none;
            border-color: #777;
        }

        .controls button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 6px 10px;
            font-size: 13px;
            font-family: system-ui;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            height: 29px;
            min-width: 100px;
        }

        .controls button:hover {
            background: #45a049;
        }

        .controls button:active {
            background: #3d8b40;
        }

        .controls button:disabled {
            background: #999;
            color: #ddd;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }

        .start-overlay h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
            text-align: center;
            font-family: ui-serif, system-ui;
        }

        .start-overlay p {
            color: #aaa;
            font-size: 18px;
            text-align: center;
        }

        .start-overlay.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="start-overlay" id="start-overlay">
        <h1>Click to Start</h1>
        <p>Click anywhere to begin</p>
    </div>
    <div class="controls">
        <select id="song-select">
            <option value="cello-suite.abc">Cello Suite No.1, BWV 1007 - Prelude</option>
            <option value="prelude-938.abc">Prelude BWV 938</option>
            <option value="little-figure-g-minor.abc">Little Fugue in G minor, BWV 578</option>
        </select>
        <button id="play-button" disabled>Loading</button>
    </div>
    <div id="audio" style="display: none;"></div>
    <div id="audio-controls" style="display: none;"></div>
    <canvas id="canvas"></canvas>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/abcjs-audio.css">
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/dist/abcjs-basic-min.js"></script>
    <script src="permutahedron.js"></script>
    <script src="music.js"></script>
</body>
</html>
