<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABCJS Note Lighting Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .controls {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .controls select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .note-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            min-height: 200px;
            align-items: center;
            justify-content: center;
        }

        .note-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #333;
            border: 3px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.1s ease;
        }

        .circle.active {
            background: #4CAF50;
            border-color: #8FFF8F;
            box-shadow: 0 0 20px #4CAF50;
            transform: scale(1.2);
        }

        .note-label {
            font-size: 14px;
            color: #aaa;
        }

        .debug {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #0f0;
            max-height: 200px;
            overflow-y: auto;
        }

        .debug div {
            margin: 2px 0;
        }

        #audio {
            /* ABCJS creates controls here - keep visible! */
        }

        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }

        .start-overlay h2 {
            color: white;
            font-size: 36px;
            margin-bottom: 15px;
        }

        .start-overlay p {
            color: #aaa;
            font-size: 16px;
        }

        .start-overlay.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="start-overlay" id="start-overlay">
        <h2>Click to Start</h2>
        <p>Click anywhere to initialize audio</p>
    </div>

    <h1>ABCJS Note Lighting Test</h1>

    <div class="controls">
        <select id="song-select">
            <option value="cello-suite.abc">Cello Suite No.1, BWV 1007 - Prelude</option>
            <option value="prelude-938.abc">Prelude BWV 938</option>
            <option value="little-figure-g-minor.abc">Little Fugue in G minor, BWV 578</option>
        </select>
        <div id="audio"></div>
    </div>

    <div class="note-container" id="note-container">
        <!-- Note circles will be added here -->
    </div>

    <div class="debug" id="debug">
        <div>Debug console ready</div>
    </div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/abcjs-audio.css">
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/dist/abcjs-basic-min.js"></script>

    <script>
        (function() {
            'use strict';

            const state = {
                visualObj: null,
                synthController: null,
                midiBuffer: null,
                allNotes: new Map(),  // Map of pitch -> {pitch, name}
                currentNotes: new Set(),
                noteTimeouts: new Map(),  // Map of pitch -> timeout ID
                playbackStartTime: null  // When playback actually started
            };

            // Convert MIDI pitch to note name (e.g., 60 -> C4)
            function midiToNoteName(midi) {
                const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                const octave = Math.floor(midi / 12) - 1;
                const noteName = noteNames[midi % 12];
                return noteName + octave;
            }

            function log(message) {
                const debugDiv = document.getElementById('debug');
                const entry = document.createElement('div');
                const timestamp = new Date().toLocaleTimeString();
                entry.textContent = `[${timestamp}] ${message}`;
                debugDiv.appendChild(entry);
                debugDiv.scrollTop = debugDiv.scrollHeight;
                console.log(message);
            }

            function createNoteCircles() {
                const container = document.getElementById('note-container');
                container.innerHTML = '';

                if (state.allNotes.size === 0) {
                    container.innerHTML = '<div style="color: #666;">No notes found in song</div>';
                    return;
                }

                const sortedNotes = Array.from(state.allNotes.values()).sort((a, b) => a.pitch - b.pitch);

                sortedNotes.forEach(note => {
                    const noteCircle = document.createElement('div');
                    noteCircle.className = 'note-circle';
                    noteCircle.innerHTML = `
                        <div class="circle" data-pitch="${note.pitch}">
                            ${note.name}
                        </div>
                        <div class="note-label">MIDI ${note.pitch}</div>
                    `;
                    container.appendChild(noteCircle);
                });

                log(`Created ${state.allNotes.size} note circles`);
            }

            function clearAllNotes() {
                // Clear all scheduled timeouts
                state.noteTimeouts.forEach(timeoutId => clearTimeout(timeoutId));
                state.noteTimeouts.clear();
                state.currentNotes.clear();
                updateNoteDisplay();
            }

            function updateNoteDisplay() {
                // Clear all circles
                document.querySelectorAll('.circle').forEach(circle => {
                    circle.classList.remove('active');
                });

                // Light up currently playing notes
                state.currentNotes.forEach(pitch => {
                    const circle = document.querySelector(`.circle[data-pitch="${pitch}"]`);
                    if (circle) {
                        circle.classList.add('active');
                    }
                });
            }

            // CursorControl - the CORRECT way to get note events in ABCJS
            var CursorControl = function() {
                var self = this;

                self.onStart = function() {
                    log('Playback started');
                    // Clear any leftover notes from previous playback
                    clearAllNotes();
                    // Reset timing
                    state.playbackStartTime = Date.now();
                };

                self.onFinished = function() {
                    log('Playback finished');
                    clearAllNotes();
                };

                self.onBeat = function(beatNumber, totalBeats, totalTime) {
                    // Called on each beat
                };

                self.onEvent = function(ev) {
                    // Ignore events before playback has started
                    if (!state.playbackStartTime) {
                        return;
                    }

                    // DON'T clear currentNotes - let timeouts handle removing notes!

                    if (ev.midiPitches && ev.midiPitches.length > 0) {
                        ev.midiPitches.forEach(function(midiNote) {
                            const pitch = midiNote.pitch;

                            // Add note to currently playing
                            state.currentNotes.add(pitch);

                            // Clear any existing timeout for this pitch (re-triggered note)
                            if (state.noteTimeouts.has(pitch)) {
                                clearTimeout(state.noteTimeouts.get(pitch));
                            }

                            // Calculate note duration in milliseconds
                            const durationMs = midiNote.duration * ev.millisecondsPerMeasure;

                            // Schedule removing the note when it ends
                            const timeoutId = setTimeout(function() {
                                state.currentNotes.delete(pitch);
                                state.noteTimeouts.delete(pitch);
                                updateNoteDisplay();
                            }, durationMs);

                            state.noteTimeouts.set(pitch, timeoutId);
                        });

                        const noteNames = Array.from(state.currentNotes).map(p => midiToNoteName(p)).join(', ');
                        log(`Playing: ${noteNames}`);
                    }

                    updateNoteDisplay();
                };
            };

            async function loadSong(filename) {
                log(`Loading ${filename}...`);

                // Stop any existing playback
                if (state.synthController) {
                    try {
                        state.synthController.pause();
                    } catch (e) {}
                }

                // Clear ALL state from previous song
                clearAllNotes();
                state.allNotes.clear();
                state.playbackStartTime = null;

                // Clear the note circle display
                const container = document.getElementById('note-container');
                container.innerHTML = '<div style="color: #666;">Loading...</div>';

                try {
                    const response = await fetch(`songs/${filename}?t=${Date.now()}`, {
                        cache: 'no-store'
                    });
                    if (!response.ok) {
                        throw new Error(`Failed to load: ${response.statusText}`);
                    }
                    const abcText = await response.text();
                    log(`Loaded ${abcText.length} characters`);

                    // Render ABC to get visual object
                    const renderResult = ABCJS.renderAbc("notation-placeholder", abcText);
                    state.visualObj = renderResult[0];

                    if (!state.visualObj) {
                        throw new Error('Failed to parse ABC notation');
                    }
                    log('ABC parsed successfully');

                    // Create synth buffer
                    if (!ABCJS.synth.supportsAudio()) {
                        throw new Error('Audio not supported');
                    }

                    log('Creating MIDI buffer...');
                    state.midiBuffer = new ABCJS.synth.CreateSynth();

                    // Use sequenceCallback to extract notes - this works!
                    await state.midiBuffer.init({
                        visualObj: state.visualObj,
                        options: {
                            sequenceCallback: function(tracks) {
                                state.allNotes.clear();

                                tracks.forEach(track => {
                                    track.forEach(event => {
                                        if (event.pitch !== undefined) {
                                            state.allNotes.set(event.pitch, {
                                                pitch: event.pitch,
                                                name: midiToNoteName(event.pitch)
                                            });
                                        }
                                    });
                                });

                                log(`Found ${state.allNotes.size} unique notes`);
                                createNoteCircles();
                            }
                        }
                    });

                    await state.midiBuffer.prime();
                    log('MIDI buffer ready');

                    // Create SynthController with CursorControl
                    if (!state.synthController) {
                        log('Creating SynthController...');
                        state.synthController = new ABCJS.synth.SynthController();
                        state.synthController.load("#audio", new CursorControl(), {
                            displayLoop: false,
                            displayRestart: true,
                            displayPlay: true,
                            displayProgress: true
                        });
                    }

                    // Set the tune - THIS is the key!
                    log('Setting tune in controller...');
                    await state.synthController.setTune(state.visualObj, true);
                    log('Song loaded and ready!');

                } catch (error) {
                    log(`ERROR: ${error.message}`);
                    console.error(error);
                }
            }

            // Initialize when page loads
            document.addEventListener('DOMContentLoaded', () => {
                const startOverlay = document.getElementById('start-overlay');

                if (startOverlay) {
                    startOverlay.addEventListener('click', () => {
                        startOverlay.classList.add('hidden');
                        log('User interaction - audio context ready');

                        const songSelect = document.getElementById('song-select');
                        if (songSelect) {
                            songSelect.addEventListener('change', (e) => {
                                loadSong(e.target.value);
                            });
                        }

                        // Clear notes when user switches tabs/windows
                        window.addEventListener('blur', () => {
                            log('Window lost focus - clearing notes');
                            clearAllNotes();
                        });

                        // Load default song
                        if (typeof ABCJS !== 'undefined') {
                            loadSong('cello-suite.abc');
                        } else {
                            log('ERROR: ABCJS not loaded');
                        }
                    });
                }
            });
        })();
    </script>

    <!-- Hidden div for notation rendering -->
    <div id="notation-placeholder" style="display: none;"></div>
</body>
</html>
