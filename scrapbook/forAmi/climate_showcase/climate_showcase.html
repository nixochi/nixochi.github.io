    <!-- Component Embedder with PDF.js Protection -->
    <script>
// component-embedder.js - PDF.js Source-Based Protection

const ComponentEmbedder = {
    containers: new Map(),
    componentsByPage: new Map(),
    isInitialized: false,

    initialize() {
        if (this.isInitialized) return;
        if (!window.COMPONENT_SPECS?.length) {
            console.log('ComponentEmbedder: No components to embed');
            return;
        }

        console.log('ComponentEmbedder: Initializing with', COMPONENT_SPECS.length, 'components');

        this.patchReset();
        this.patchDraw();
        this.createAllComponents();
        this.setupEventListeners();
        this.isInitialized = true;

        // Initial positioning for already-rendered pages
        this.repositionAll();

        console.log('ComponentEmbedder: Initialization complete');
    },

    patchReset() {
        if (!pdfViewer?._pages?.length) {
            console.warn('ComponentEmbedder: No pages available for patching');
            return;
        }

        const pageView = pdfViewer._pages[0];
        const proto = Object.getPrototypeOf(pageView);

        if (proto.reset._webTexPatched) {
            console.log('ComponentEmbedder: reset() already patched');
            return;
        }

        const originalReset = proto.reset;

        proto.reset = function(keepZoomLayer = false, keepAnnotationLayer = false) {
            const div = this.div;
            const childNodes = div.childNodes;
            const zoomLayerNode = keepZoomLayer && this.zoomLayer || null;
            const annotationNode = keepAnnotationLayer && this.annotationLayer?.div || null;

            // Cancel rendering (from original)
            this.cancelRendering();
            this.renderingState = 0;

            // Remove children except preserved nodes
            for (let i = childNodes.length - 1; i >= 0; i--) {
                const node = childNodes[i];

                // Keep PDF.js layers
                if (node === zoomLayerNode || node === annotationNode) continue;

                // Keep WebTeX containers
                if (node.classList?.contains('webtex-component-container')) {
                    continue;
                }

                node.remove();
            }
        };

        proto.reset._webTexPatched = true;
        console.log('ComponentEmbedder: Patched PDFPageView.reset()');
    },

    patchDraw() {
        if (!pdfViewer?._pages?.length) return;

        const pageView = pdfViewer._pages[0];
        const proto = Object.getPrototypeOf(pageView);

        if (proto.draw._webTexPatched) {
            console.log('ComponentEmbedder: draw() already patched');
            return;
        }

        const originalDraw = proto.draw;
        const self = this;

        proto.draw = function() {
            const pageNumber = this.id;
            const result = originalDraw.apply(this, arguments);

            const afterDraw = () => {
                requestAnimationFrame(() => {
                    self.positionComponentsOnPage(pageNumber, this);
                });
            };

            if (result?.then) {
                return result.then((r) => { afterDraw(); return r; });
            } else {
                afterDraw();
                return result;
            }
        };

        proto.draw._webTexPatched = true;
        console.log('ComponentEmbedder: Patched PDFPageView.draw()');
    },

    createAllComponents() {
        COMPONENT_SPECS.forEach(spec => {
            // Create container
            const container = document.createElement('div');
            container.className = 'webtex-component-container';
            container.id = 'webtex-' + spec.id;
            container.dataset.componentId = spec.id;
            container.dataset.page = spec.page;

            container.style.cssText = `
                position: absolute;
                box-sizing: border-box;
                z-index: 1000;
                overflow: hidden;
                transition: none !important;
                will-change: left, top, width, height;
            `;

            // Convert intrinsic size from bp to px (1 inch = 72 bp = 96 px)
            const intrinsicWidthPx = spec.width * (96 / 72);
            const intrinsicHeightPx = spec.height * (96 / 72);

            // Create the actual web component at intrinsic size
            const component = document.createElement(spec.tagName);
            component.style.cssText = `
                display: block;
                width: ${intrinsicWidthPx}px;
                height: ${intrinsicHeightPx}px;
                transform-origin: top left;
            `;

            // Set params as HTML attributes
            if (spec.params) {
                for (const [key, value] of Object.entries(spec.params)) {
                    component.setAttribute(key, value);
                }
            }

            container.appendChild(component);

            // Attach to page div
            const pageView = pdfViewer.getPageView(spec.page - 1);
            if (pageView?.div) {
                pageView.div.appendChild(container);
            }

            // Store reference with intrinsic dimensions
            this.containers.set(spec.id, {
                container,
                component,
                spec,
                intrinsicWidthPx,
                intrinsicHeightPx
            });

            // Group by page
            if (!this.componentsByPage.has(spec.page)) {
                this.componentsByPage.set(spec.page, []);
            }
            this.componentsByPage.get(spec.page).push(spec.id);
        });

        console.log('ComponentEmbedder: Created', this.containers.size, 'components');
    },

    positionComponentsOnPage(pageNumber, pageView = null, show = true) {
        if (!pageView) {
            pageView = pdfViewer.getPageView(pageNumber - 1);
        }
        if (!pageView?.div) {
            console.warn('ComponentEmbedder: No page div for page', pageNumber);
            return;
        }

        const componentIds = this.componentsByPage.get(pageNumber) || [];
        if (componentIds.length === 0) return;

        const pageDiv = pageView.div;
        const viewport = pageView.viewport;

        if (!viewport) {
            console.warn('ComponentEmbedder: No viewport for page', pageNumber);
            return;
        }

        // PDF dimensions from viewBox (unscaled PDF points)
        const pdfWidth = viewport.viewBox?.[2] || (viewport.width / viewport.scale);
        const pdfHeight = viewport.viewBox?.[3] || (viewport.height / viewport.scale);

        // Use page div dimensions directly (PDF.js sizes it to match the rendered PDF)
        const renderWidth = pageDiv.offsetWidth;
        const renderHeight = pageDiv.offsetHeight;

        // Skip positioning if dimensions are invalid
        if (renderWidth <= 0 || renderHeight <= 0) {
            console.warn('ComponentEmbedder: Invalid dimensions for page', pageNumber);
            return;
        }

        componentIds.forEach(id => {
            const data = this.containers.get(id);
            if (!data) return;

            const { container, component, spec, intrinsicWidthPx } = data;

            // Convert PDF coordinates to screen coordinates
            // spec.x, spec.y are in PDF points (origin bottom-left)
            // CSS uses origin top-left
            const x = (spec.x / pdfWidth) * renderWidth;
            const y = ((pdfHeight - spec.y - spec.height) / pdfHeight) * renderHeight;
            const width = (spec.width / pdfWidth) * renderWidth;
            const height = (spec.height / pdfHeight) * renderHeight;

            container.style.left = x + 'px';
            container.style.top = y + 'px';
            container.style.width = width + 'px';
            container.style.height = height + 'px';

            // Calculate and apply zoom factor
            const zoomFactor = width / intrinsicWidthPx;
            component.style.zoom = zoomFactor;

            // Show after positioning if requested
            if (show) {
                container.style.visibility = 'visible';
            }

            // Ensure attached to correct page
            if (container.parentNode !== pageDiv) {
                pageDiv.appendChild(container);
            }
        });
    },

    hideAllComponents() {
        this.containers.forEach(({ container }) => {
            container.style.visibility = 'hidden';
        });
    },

    repositionAll() {
        for (let pageNum = 1; pageNum <= pdfViewer.pagesCount; pageNum++) {
            const pageView = pdfViewer.getPageView(pageNum - 1);
            if (pageView?.div && this.isPageRendered(pageView)) {
                this.positionComponentsOnPage(pageNum, pageView);
            }
        }
    },

    isPageRendered(pageView) {
        const hasCanvas = pageView.div?.querySelector('canvas');
        const hasValidSize = pageView.div?.offsetWidth > 0 && pageView.div?.offsetHeight > 0;
        return hasCanvas && hasValidSize;
    },

    setupEventListeners() {
        const eventBus = pdfViewer.eventBus;

        // Hide components immediately when scale starts changing
        // to prevent them appearing at wrong positions
        eventBus.on('scalechanging', () => {
            this.hideAllComponents();
        });

        // pagerendered fires after page is fully rendered with correct dimensions
        eventBus.on('pagerendered', (evt) => {
            requestAnimationFrame(() => {
                this.positionComponentsOnPage(evt.pageNumber);
            });
        });

        let resizeTimeout;
        window.addEventListener('resize', () => {
            this.hideAllComponents();
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                this.repositionAll();
            }, 16);
        });

        console.log('ComponentEmbedder: Event listeners registered');
    },

    // Debug: check container status
    debug() {
        console.log('=== ComponentEmbedder Debug ===');
        console.log('Initialized:', this.isInitialized);
        console.log('Containers:', this.containers.size);

        this.containers.forEach((data, id) => {
            const { container, spec } = data;
            const connected = container.isConnected;
            const parent = container.parentNode?.className || 'none';
            const rect = container.getBoundingClientRect();
            console.log(`  ${id}: connected=${connected}, parent="${parent}", rect=(${rect.x.toFixed(0)},${rect.y.toFixed(0)},${rect.width.toFixed(0)}x${rect.height.toFixed(0)})`);
        });

        // Check if reset is patched
        if (pdfViewer?._pages?.length) {
            const proto = Object.getPrototypeOf(pdfViewer._pages[0]);
            console.log('reset() patched:', !!proto.reset._webTexPatched);
            console.log('draw() patched:', !!proto.draw._webTexPatched);
        }
    }
};

// Expose debug globally
window.debugComponents = () => ComponentEmbedder.debug();

console.log('ComponentEmbedder: Module loaded (use debugComponents() to inspect)');

    </script>
