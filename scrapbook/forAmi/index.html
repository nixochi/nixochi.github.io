








<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>xochi — for Ami</title>
  <meta name="description" content="Projects for Ami." />
  <style>
:root {
  --bg:     #161617;  
  --fg:     #f3f3f3;  
  --muted:  #b9b9b9;  
  --line:   #222224;   
  --card:   #1c1c1e;   
  --shadow: rgba(0,0,0,0.5);
  --radius: 12px;
  --maxw: 80ch;
}


html, body { height: 100%; }
body{
  margin:0; background:var(--bg); color:var(--fg);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font: 16px/1.6 system-ui;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100svh;
}

.wrapper{ max-width: 980px; margin: 0 auto; padding: 0 20px; }
.prose{ max-width: var(--maxw); }

h1, h2, h3{
  font-family: ui-serif, system-ui;
  letter-spacing: -0.01em; line-height: 1.15; margin: .6rem 0 .5rem;
}
h1{ font-size: clamp(28px, 3.6vw, 40px); }
h2{ font-size: clamp(18px, 2vw, 22px); }
h3{ font-size: 18px; }

p{ margin: .6rem 0; }
.muted{ color: var(--muted); }

.subtitle {
  color: var(--muted);
}

a{ color: inherit; text-underline-offset: 3px; }

hr{ border:0; border-top: 1px solid var(--line); margin: 2rem 0; }

.header{
  position: sticky; top: 0; z-index: 10;
  backdrop-filter: blur(6px);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  border-bottom: 1px solid var(--line);
}
.nav{ display:flex; align-items:center; justify-content:space-between; height:60px; }
.xochi{
  font-family: ui-serif, system-ui;
  font-size: 18px;
  letter-spacing:.2px;
  text-decoration: none;
}
.links{ display:flex; gap: 18px; }
.links a{ font-size: 14px; opacity:.85; text-decoration:none; }
.links a:hover{ opacity:1; text-decoration: underline; }
.links a[aria-current="page"]{ opacity:1; text-decoration: underline; }

main{
  padding: 12px 0;
  flex: 1;
}

@media (min-width: 720px){
  main{
    padding: 48px 0;
  }
}

.card{
  border:1px solid var(--line); background: var(--card);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px 16px 16px;
}
.grid{ display:grid; gap: 16px; }
.grid.cols-2{ grid-template-columns: 1fr 1fr; }
.grid.cols-3{ grid-template-columns: 1fr 1fr 1fr; }

footer { 
  padding: 14px 0;
}

footer .wrapper {
  max-width: 980px;
  margin: 0 20px 0 auto;
  padding: 0;
  text-align: right;
}

footer small {
  color: var(--muted);
}

.skip{ position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden; }
.skip:focus{ position:static; width:auto; height:auto; padding:8px; background:var(--card); border:1px solid var(--line); border-radius:8px; }

/* Entry name styling for blue links */
.entry-name { font-weight: 500; margin-bottom: 2px; }
.entry-name a { color: #4a9eff; text-decoration: none; }
.entry-name a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <a href="#main" class="skip">skip to content</a>

  <header class="header">
    <div class="wrapper nav" role="navigation" aria-label="primary">
      <a href="../../index.html" class="xochi" data-nav>xochi</a>
      <nav class="links">
        <a href="../../projects.html" data-nav>projects</a>
        <a href="../../applets.html" data-nav>applets</a>
        <a href="../../scrapbook.html" data-nav>scrapbook</a>
        <a href="../../writings.html" data-nav>writings</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="wrapper prose">
      <h1>for Ami</h1>

      <div class="applet-row">
        <div class="applet-info">
          <div class="applet-name"><a href="climate_showcase/climate_showcase.html">climate showcase</a></div>
          <div class="applet-text">WebTeX climate visualization with before/after comparisons.</div>
        </div>
      </div>

    </div>
  </main>

  <style>
    .applet-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .applet-row:last-child { border-bottom: none; }
    .applet-info { flex: 1; }
    .applet-name {
      font-weight: 500;
      margin-bottom: 2px;
    }
    .applet-name a {
      color: #4a9eff;
      text-decoration: none;
    }
    .applet-name a:hover {
      text-decoration: underline;
    }
    .applet-text {
      font-size: 14px;
      color: var(--muted);
    }
    .applet-link {
      flex-shrink: 0;
      margin-left: 16px;
      font-size: 14px;
      text-decoration: none;
    }
    .applet-link:hover {
      text-decoration: underline;
    }
  </style>

  <footer>
    <div class="wrapper">
      <small>by xochi</small>
    </div>
  </footer>

  <script src="../../script.js" defer></script>
</body>
</html>
