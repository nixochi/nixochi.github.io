            ui.btnPrevPage.disabled = current <= 1;
            ui.btnNextPage.disabled = current >= total;
        }

        document.querySelectorAll('.webtex-dropdown-menu').forEach(menu => {
            menu.classList.remove('open');

        e.stopPropagation();
        const isOpen = ui.downloadMenu.classList.contains('open');
        closeAllDropdowns();
        if (!isOpen) {
            ui.downloadMenu.classList.add('open');
        }
    });

    document.addEventListener('click', () => {
        closeAllDropdowns();
    });

    ui.downloadMenu.addEventListener('click', (e) => {
        e.stopPropagation();
    });

    });

        if (typeof zoomIn === 'function') zoomIn();

        if (typeof zoomOut === 'function') zoomOut();
    });

    });

    });

    });

    ui.btnDownloadHTML.addEventListener('click', () => {

            }
        }
    });

        if (typeof getCurrentPage === 'function') {
            ui.pageInput.value = getCurrentPage();
        }
    });
})();
