<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Permutahedron</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #1a1a1a;
            touch-action: none;
            font-family: monospace;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
        }

        canvas:active {
            cursor: grabbing;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        .controls select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 6px 10px;
            font-size: 13px;
            font-family: monospace;
            border-radius: 4px;
            cursor: pointer;
            height: 29px;
        }

        .controls select:hover {
            background: #444;
        }

        .controls select:focus {
            outline: none;
            border-color: #777;
        }

        .controls button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 6px 10px;
            font-size: 13px;
            font-family: monospace;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            height: 29px;
            min-width: 80px;
        }

        .controls button:hover {
            background: #45a049;
        }

        .controls button:active {
            background: #3d8b40;
        }

        .controls button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .debug-console {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #555;
            border-radius: 8px;
            width: 400px;
            max-height: 300px;
            display: none; /* Hidden by default */
            flex-direction: column;
        }

        .debug-header {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .debug-header h3 {
            margin: 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
        }

        .debug-buttons {
            display: flex;
            gap: 5px;
        }

        .debug-buttons button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 4px 8px;
            font-size: 11px;
            font-family: monospace;
            border-radius: 3px;
            cursor: pointer;
        }

        .debug-buttons button:hover {
            background: #444;
        }

        .debug-output {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 11px;
            line-height: 1.4;
            color: #ccc;
            font-family: monospace;
        }

        .debug-entry {
            margin-bottom: 5px;
            padding: 3px 5px;
            border-left: 3px solid transparent;
        }

        .debug-entry.log {
            border-left-color: #4CAF50;
        }

        .debug-entry.error {
            border-left-color: #f44336;
            color: #ffcdd2;
        }

        .debug-entry .timestamp {
            color: #888;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="controls">
        <select id="song-select">
            <option value="example.abc">Permutahedron Melody</option>
            <option value="butterfly.abc">Butterfly</option>
        </select>
        <button id="play-button">Play</button>
    </div>
    <div id="audio" style="display: none;"></div>
    <canvas id="canvas"></canvas>
    <div class="debug-console">
        <div class="debug-header">
            <h3>Debug Console</h3>
            <div class="debug-buttons">
                <button id="copy-logs">Copy</button>
                <button id="clear-logs">Clear</button>
            </div>
        </div>
        <div class="debug-output" id="debug-output"></div>
    </div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/abcjs-audio.css">
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/dist/abcjs-basic-min.js"
            onload="console.log('ABCJS script loaded')"
            onerror="console.error('Failed to load ABCJS from CDN')"></script>
    <script src="debug.js"></script>
    <script src="permutahedron.js"></script>
    <script src="music.js"></script>
</body>
</html>
